<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <title>NEXT SEASON | لوحة التحكم الشاملة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #E10600; --primary-red-hover: #B80000; --black: #0A0A0A;
            --surface-main: #FFFFFF; --surface-soft: #F7F7F7; --surface-card: #FFFFFF;
            --heading-color: #0A0A0A; --body-color: #4A4A4A; --border-color: #E5E5E5;
            --red-gradient: linear-gradient(135deg, #E10600, #B80000);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 32px rgba(225,6,0,0.15); --font: 'Cairo', sans-serif;
            --font-display: 'Space Grotesk', sans-serif; --radius: 16px; --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 1. إصلاح التمرير الأفقي الأساسي */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
        html, body { 
            width: 100%;
            max-width: 100%;
            overflow-x: hidden; /* منع التمرير الأفقي نهائياً */
        }
        body { 
            background-color: var(--surface-soft); 
            color: var(--body-color); 
            -webkit-font-smoothing: antialiased; 
        }
        
        #dashboard { 
            display: flex; 
            min-height: 100vh; 
            position: relative; 
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        
        /* 2. إصلاح القائمة الجانبية على الهواتف */
        .sidebar { 
            width: 280px; 
            background: var(--black); 
            color: #FFF; 
            position: fixed; 
            top: 0; 
            right: 0; 
            bottom: 0; 
            z-index: 999; 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.3s ease; 
            border-left: 1px solid rgba(255,255,255,0.05); 
            height: 100vh;
            height: 100dvh; /* دعم متصفحات الهواتف */
            transform: translateX(0); /* مفتوحة افتراضياً على الديسكتوب */
        }
        .sidebar-header { padding: 30px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-header h2 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; color: #FFF; }
        .sidebar-header h2 span { color: var(--primary-red); }
        .sidebar-header p { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .sidebar-nav { padding: 20px 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.95rem; transition: var(--transition); cursor: pointer; }
        .sidebar-nav a:hover { background: rgba(255,255,255,0.05); color: #FFF; }
        .sidebar-nav a.active { background: var(--red-gradient); color: #FFF; box-shadow: var(--shadow-lg); }

        /* طبقة التعتيم (Overlay) للهواتف */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            backdrop-filter: blur(2px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* 3. المحتوى الرئيسي */
        .main-content { 
            flex: 1; 
            margin-right: 280px; /* مسافة للقائمة على الديسكتوب */
            padding: 40px; 
            transition: margin 0.3s ease; 
            width: calc(100% - 280px);
            max-width: 100%;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .top-bar h1 { color: var(--heading-color); font-size: 1.8rem; font-weight: 900; letter-spacing: -0.5px; }

        /* Cards & Forms */
        .card { 
            background: var(--surface-card); 
            border-radius: var(--radius); 
            padding: 32px; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border-color); 
            margin-bottom: 24px; 
            animation: slideUp 0.4s ease forwards; 
            opacity: 0; 
            transform: translateY(20px); 
            width: 100%; 
            max-width: 100%;
            overflow: hidden;
        }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; color: var(--heading-color); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.95rem; font-family: inherit; color: var(--heading-color); background: var(--surface-soft); transition: var(--transition); outline: none; }
        .form-control:focus { border-color: var(--primary-red); background: #FFF; box-shadow: 0 0 0 4px rgba(225,6,0,0.1); }
        textarea.form-control { resize: vertical; min-height: 120px; line-height: 1.6; }

        /* Upload Area */
        .upload-area { border: 2px dashed var(--border-color); border-radius: var(--radius); padding: 30px 20px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--surface-soft); position: relative; width: 100%; }
        .upload-area:hover { border-color: var(--primary-red); background: rgba(225,6,0,0.02); }
        .upload-area input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 16px; margin-top: 20px; width: 100%; }
        .preview-item { position: relative; aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; border: 2px solid var(--border-color); }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-remove { position: absolute; top: 4px; right: 4px; background: rgba(10,10,10,0.8); color: #FFF; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border-radius: var(--radius-sm); font-weight: 800; font-size: 1rem; font-family: inherit; cursor: pointer; transition: var(--transition); border: none; outline: none; }
        .btn-primary { background: var(--red-gradient); color: #FFF; box-shadow: var(--shadow-lg); width: 100%; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(225,6,0,0.3); }
        
        /* Dynamic Rows (Social & Contacts) */
        .dynamic-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; width: 100%; }
        .dynamic-row input, .dynamic-row select { flex: 1; min-width: 0; }
        .dynamic-row button { background: #FEE2E2; color: #DC2626; border: none; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 700; flex-shrink: 0; }

        /* Desktop Table */
        .table-responsive { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border-color); width: 100%; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th { background: var(--surface-soft); padding: 16px; text-align: right; font-weight: 800; font-size: 0.85rem; color: var(--heading-color); border-bottom: 1px solid var(--border-color); }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; font-size: 0.9rem; }
        tr:hover td { background: rgba(0,0,0,0.01); }
        .table-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); }
        .action-btns { display: flex; gap: 8px; }
        .btn-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; transition: var(--transition); font-size: 1.1rem; }
        .btn-edit { background: #E0F2FE; color: #0284C7; } .btn-edit:hover { background: #0284C7; color: #FFF; }
        .btn-delete { background: #FEE2E2; color: #DC2626; } .btn-delete:hover { background: #DC2626; color: #FFF; }

        /* Toast */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--black); color: #FFF; padding: 16px 32px; border-radius: 50px; font-weight: 700; box-shadow: 0 20px 40px rgba(0,0,0,0.2); opacity: 0; transition: var(--transition); z-index: 10000; display: flex; align-items: center; gap: 10px; width: 90%; max-width: 400px; justify-content: center; text-align: center; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #toast.error { background: #DC2626; } #toast.success { background: #10B981; }

        /* Mobile Header */
        .mobile-header { display: none; background: var(--black); color: #FFF; padding: 16px 20px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1001; width: 100%; }
        .mobile-header h2 { font-family: var(--font-display); font-size: 1.2rem; }
        .mobile-header span { color: var(--primary-red); }
        .mobile-toggle { background: transparent; border: none; color: #FFF; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; }

        /* 4. التجاوب مع الهواتف (Media Queries) */
        @media (max-width: 900px) {
            .mobile-header { display: flex; }
            
            /* القائمة الجانبية تصبح درج جانبي */
            .sidebar { 
                transform: translateX(100%); /* مخفية افتراضياً */
                width: 85vw; 
                max-width: 320px; 
                box-shadow: -10px 0 30px rgba(0,0,0,0.5); 
            }
            .sidebar.open { 
                transform: translateX(0); /* تظهر عند الضغط */
            }
            
            /* تصفير المسافة اليمنى للمحتوى وإعطائه العرض الكامل */
            .main-content { 
                margin-right: 0; 
                width: 100%; 
                padding: 20px 16px; 
            }
            .card { padding: 20px; }
            
            /* جعل الصفوف الديناميكية تتكدس عمودياً */
            .dynamic-row { flex-direction: column; align-items: stretch; gap: 8px; }
            .dynamic-row button { padding: 10px; margin-top: 0; width: 100%; }
            .dynamic-row select { flex: auto; }
            
            /* تحويل الجدول إلى بطاقات على الهاتف */
            .table-responsive { border: none; overflow: visible; width: 100%; }
            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            
            tr { 
                background: var(--surface-card); 
                border: 1px solid var(--border-color); 
                border-radius: var(--radius-sm); 
                margin-bottom: 16px; 
                padding: 16px; 
                box-shadow: var(--shadow-sm); 
                width: 100%;
            }
            
            td { 
                border: none; 
                position: relative; 
                padding: 8px 0; 
                padding-right: 45%; 
                text-align: right; 
                white-space: normal; 
                width: 100%;
                word-wrap: break-word;
            }
            td:before { 
                position: absolute; 
                top: 8px; 
                right: 0; 
                width: 40%; 
                white-space: nowrap; 
                font-weight: 700; 
                color: var(--heading-color); 
                content: attr(data-label); 
            }
            
            td:first-child { padding-right: 0; text-align: center; padding-bottom: 16px; }
            td:first-child:before { display: none; }
            .table-img { width: 100%; height: 200px; border-radius: var(--radius-sm); object-fit: cover; }
            .action-btns { justify-content: flex-end; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- طبقة التعتيم للهواتف -->

        const SUPABASE_URL = 'https://mxwftmpidpsbowtuxvyl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_x83pQypR_ZHiN4hMXx8ySQ_Te1pZF87';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedFiles = [];
        let existingImageUrls = [];
        let currentSettings = {};

        document.addEventListener('DOMContentLoaded', () => {

        // ==========================================
        // إدارة القائمة الجانبية (Sidebar)
        // ==========================================
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
            document.body.style.overflow = 'hidden'; // منع التمرير في الخلفية
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ==========================================
        // التنقل
        // ==========================================
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            document.getElementById('tab-' + tabId).style.display = 'block';
            if(element) element.classList.add('active');
            
            const titles = { articles: 'إدارة المقالات', about: 'تعديل صفحة من نحن', contact: 'معلومات التواصل', social: 'روابط التواصل الاجتماعي' };
            document.getElementById('pageTitle').innerText = titles[tabId];

            if (tabId === 'about') fillAboutForm();
            if (tabId === 'contact') fillContactForm();
            if (tabId === 'social') fillSocialForm();

            // إغلاق القائمة تلقائياً على الهواتف
            if (window.innerWidth <= 900) closeSidebar();
        }

        // ==========================================
        // إدارة المقالات
        // ==========================================
        function showArticleForm() { document.getElementById('articleFormCard').style.display = 'block'; window.scrollTo({top:0, behavior:'smooth'}); }
        function hideArticleForm() { document.getElementById('articleFormCard').style.display = 'none'; resetArticleForm(); }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                if(file.type.startsWith('image/')) { selectedFiles.push(file); renderPreview(file); }
            });
            event.target.value = '';
        }

        function renderPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${e.target.result}"><button type="button" class="preview-remove" onclick="removeSelectedFile(this, '${file.name}')">×</button>`;
                document.getElementById('imagePreviewContainer').appendChild(div);
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedFile(btn, fileName) {
            btn.parentElement.remove();
            selectedFiles = selectedFiles.filter(f => f.name !== fileName);
        }
        function removeExistingImage(btn, url) {
            btn.parentElement.remove();
            existingImageUrls = existingImageUrls.filter(u => u !== url);
        }

        async function saveArticle(e) {
            e.preventDefault();
            const id = document.getElementById('articleId').value;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = 'جاري الحفظ...';

            try {
                let uploadedUrls = [];
                for (const file of selectedFiles) {
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${file.name.split('.').pop()}`;
                    const { error } = await supabaseClient.storage.from('images').upload(fileName, file);
                    if (error) throw new Error('فشل الرفع: ' + error.message);
                    const { data: urlData } = supabaseClient.storage.from('images').getPublicUrl(fileName);
                    uploadedUrls.push(urlData.publicUrl);
                }

                const finalImages = [...existingImageUrls, ...uploadedUrls];
                const articleData = {
                    title: document.getElementById('title').value,
                    category_id: parseInt(document.getElementById('category_id').value),
                    content: document.getElementById('content').value,
                    images: finalImages,
                    image_url: finalImages.length > 0 ? finalImages[0] : null 
                };

                let error;
                if (id) {
                    const res = await supabaseClient.from('articles').update(articleData).eq('id', id);
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('articles').insert([articleData]);
                    error = res.error;
                }

                if (error) throw error;
                showToast(id ? 'تم تعديل المقال' : 'تم نشر المقال', 'success');
                hideArticleForm(); loadArticles();
            } catch (err) { showToast(err.message, 'error'); } 
            finally { btn.disabled = false; btn.innerText = 'حفظ المقال'; }
        }

        async function loadArticles() {
            const tbody = document.getElementById('articlesTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">جاري التحميل...</td></tr>';
            const { data, error } = await supabaseClient.from('articles').select('*').order('created_at', { ascending: false });
            
            if (error) { tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center; padding:20px;">خطأ: ${error.message}</td></tr>`; return; }
            if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">لا توجد مقالات بعد.</td></tr>'; return; }

            const categories = { 1: 'أخبار', 2: 'مجتمع', 3: 'ثقافة وفنون', 4: 'شخصيات ولقاءات' };
            const defaultImg = 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=100';

            tbody.innerHTML = data.map(article => {
                let displayImg = defaultImg;
                if (article.images && article.images.length > 0) displayImg = article.images[0];
                else if (article.image_url) displayImg = article.image_url;

                return `
                <tr>
                    <td data-label="الصورة"><img src="${displayImg}" class="table-img" onerror="this.src='${defaultImg}'"></td>
                    <td data-label="العنوان" style="font-weight:700; color:var(--heading-color);">${article.title}</td>
                    <td data-label="القسم">${categories[article.category_id] || 'غير محدد'}</td>
                    <td data-label="التاريخ">${new Date(article.created_at).toLocaleDateString('ar-LY')}</td>
                    <td data-label="الإجراءات">
                        <div class="action-btns">
                            <button class="btn-icon btn-edit" onclick="editArticle(${article.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                            <button class="btn-icon btn-delete" onclick="deleteArticle(${article.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        async function editArticle(id) {
            const { data, error } = await supabaseClient.from('articles').select('*').eq('id', id).single();
            if (error) return showToast('خطأ في جلب المقال', 'error');
            
            showArticleForm();
            document.getElementById('articleId').value = data.id;
            document.getElementById('title').value = data.title;
            document.getElementById('category_id').value = data.category_id;
            document.getElementById('content').value = data.content;
            
            selectedFiles = [];
            existingImageUrls = data.images || (data.image_url ? [data.image_url] : []);
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            existingImageUrls.forEach(url => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${url}"><button type="button" class="preview-remove" onclick="removeExistingImage(this, '${url}')">×</button>`;
                container.appendChild(div);
            });
        }

        async function deleteArticle(id) {
            if (!confirm('هل أنت متأكد من حذف المقال؟')) return;
            const { error } = await supabaseClient.from('articles').delete().eq('id', id);
            if (error) showToast(error.message, 'error');
            else { showToast('تم حذف المقال', 'success'); loadArticles(); }
        }

        function resetArticleForm() {
            document.getElementById('articleForm').reset();
            document.getElementById('articleId').value = '';
            document.getElementById('imagePreviewContainer').innerHTML = '';
            selectedFiles = []; existingImageUrls = [];
        }

        // ==========================================
        // الإعدادات العامة
        // ==========================================
        async function loadSettings() {
            const { data, error } = await supabaseClient.from('site_settings').select('*').eq('id', 1).single();
            if (!error && data) currentSettings = data;
        }

        function fillAboutForm() {
            document.getElementById('about_title').value = currentSettings.about_title || '';
            document.getElementById('about_description').value = currentSettings.about_description || '';
            document.getElementById('about_vision').value = currentSettings.about_vision || '';
        }

        function fillContactForm() {
            const phonesContainer = document.getElementById('phonesContainer');
            phonesContainer.innerHTML = '';
            let phones = currentSettings.contact_phones || [];
            if (phones.length === 0 && currentSettings.contact_phone) phones = [currentSettings.contact_phone];
            if (phones.length === 0) addPhoneRow();
            else phones.forEach(p => addPhoneRow(p));

            const whatsappsContainer = document.getElementById('whatsappsContainer');
            whatsappsContainer.innerHTML = '';
            let whatsapps = currentSettings.contact_whatsapps || [];
            if (whatsapps.length === 0 && currentSettings.contact_whatsapp) whatsapps = [currentSettings.contact_whatsapp];
            if (whatsapps.length === 0) addWhatsappRow();
            else whatsapps.forEach(w => addWhatsappRow(w));
        }

        function addPhoneRow(val = '') {
            const div = document.createElement('div');
            div.className = 'dynamic-row';
            div.innerHTML = `
                <input type="text" class="form-control phone-input" value="${val}" placeholder="مثال: 0920010505" dir="ltr" style="text-align:right;">
                <button type="button" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('phonesContainer').appendChild(div);
        }

        function addWhatsappRow(val = '') {
            const div = document.createElement('div');
            div.className = 'dynamic-row';
            div.innerHTML = `
                <input type="text" class="form-control whatsapp-input" value="${val}" placeholder="مثال: 218920010505" dir="ltr" style="text-align:right;">
                <button type="button" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('whatsappsContainer').appendChild(div);
        }

        function fillSocialForm() {
            const container = document.getElementById('socialLinksContainer');
            container.innerHTML = '';
            let links = currentSettings.social_links || [];
            if (links.length === 0) addSocialRow();
            else links.forEach(link => addSocialRow(link.platform, link.url));
        }

        function addSocialRow(platform = 'facebook', url = '') {
            const container = document.getElementById('socialLinksContainer');
            const div = document.createElement('div');
            div.className = 'dynamic-row';
            div.innerHTML = `
                <select class="form-control platform-select" style="flex: 0 0 140px;">
                    <option value="facebook" ${platform === 'facebook' ? 'selected' : ''}>فيسبوك</option>
                    <option value="instagram" ${platform === 'instagram' ? 'selected' : ''}>إنستجرام</option>
                    <option value="twitter" ${platform === 'twitter' ? 'selected' : ''}>تويتر / X</option>
                    <option value="tiktok" ${platform === 'tiktok' ? 'selected' : ''}>تيك توك</option>
                    <option value="youtube" ${platform === 'youtube' ? 'selected' : ''}>يوتيوب</option>
                    <option value="linkedin" ${platform === 'linkedin' ? 'selected' : ''}>لينكد إن</option>
                </select>
                <input type="url" class="form-control url-input" value="${url}" placeholder="https://...">
                <button type="button" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(div);
        }

        async function saveSettings(e, type) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerText = 'جاري الحفظ...';

            let updateData = {};
            if (type === 'about') {
                updateData = {
                    about_title: document.getElementById('about_title').value,
                    about_description: document.getElementById('about_description').value,
                    about_vision: document.getElementById('about_vision').value
                };
            } else if (type === 'contact') {
                const phoneInputs = document.querySelectorAll('.phone-input');
                const phones = Array.from(phoneInputs).map(input => input.value.trim()).filter(v => v !== '');
                
                const whatsappInputs = document.querySelectorAll('.whatsapp-input');
                const whatsapps = Array.from(whatsappInputs).map(input => input.value.trim()).filter(v => v !== '');

                updateData = {
                    contact_phones: phones,
                    contact_whatsapps: whatsapps,
                    contact_phone: phones.length > 0 ? phones[0] : null,
                    contact_whatsapp: whatsapps.length > 0 ? whatsapps[0] : null
                };
            } else if (type === 'social') {
                const rows = document.querySelectorAll('#socialLinksContainer .dynamic-row');
                const links = Array.from(rows).map(row => ({
                    platform: row.querySelector('.platform-select').value,
                    url: row.querySelector('.url-input').value
                })).filter(l => l.url.trim() !== '');
                updateData = { social_links: links };
            }

            const { error } = await supabaseClient.from('site_settings').update(updateData).eq('id', 1);
            
            btn.disabled = false; btn.innerText = 'حفظ التعديلات';

            if (error) { showToast('خطأ: ' + error.message, 'error'); } 
            else {
                showToast('تم الحفظ بنجاح', 'success');
                loadSettings();
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.className = 'show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
